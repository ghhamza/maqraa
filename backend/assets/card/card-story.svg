<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#FDF6E3"/>

  <!-- Top zone (0–560): logo, name, teacher, badges -->
  <g id="logo-slot"/>
  <text id="tagline" x="994" y="178" direction="rtl" text-anchor="end"
        font-family="IBM Plex Sans Arabic" font-size="31" fill="#6B7280">منصة تعليم القرآن</text>

  <text id="halaqah_name" x="540" y="360" direction="rtl" text-anchor="middle"
        font-family="Amiri" font-size="144" font-weight="700" fill="#1A1A1A">حلقة النور</text>

  <text id="teacher" x="540" y="448" direction="rtl" text-anchor="middle"
        font-family="IBM Plex Sans Arabic" font-weight="500" font-size="54" fill="#6B7280">مع المعلّم أحمد</text>

  <rect x="546" y="488" width="160" height="56" rx="28" fill="#E8F5E9"/>
  <text id="type" x="626" y="526" direction="rtl" text-anchor="middle"
        font-family="IBM Plex Sans Arabic" font-weight="600" font-size="46" fill="#1B5E20">حفظ</text>
  <rect x="374" y="488" width="160" height="56" rx="28" fill="#E8F5E9"/>
  <text id="riwaya" x="454" y="526" direction="rtl" text-anchor="middle"
        font-family="IBM Plex Sans Arabic" font-weight="600" font-size="46" fill="#1B5E20">حفص</text>

  <!-- Centre zone: QR 55% = 594, cy = 960 → y = 663 -->
  <g id="qr" data-size="594" data-x="243" data-y="663" transform="translate(243 663)"/>
  <text id="scan_hint" x="540" y="1295" direction="rtl" text-anchor="middle"
        font-family="IBM Plex Sans Arabic" font-size="38" fill="#6B7280">امسح للانضمام</text>

  <!-- Bottom zone (1520–1920) -->
  <rect x="516" y="1560" width="48" height="2" fill="#D4A843"/>
  <text id="first_session" x="540" y="1620" direction="rtl" text-anchor="middle"
        font-family="IBM Plex Sans Arabic" font-weight="600" font-size="61" fill="#1B5E20">الثلاثاء ٢٥ أغسطس · ٨:٠٠ م</text>
  <text id="tz_and_rhythm" x="540" y="1680" direction="rtl" text-anchor="middle"
        font-family="IBM Plex Sans Arabic" font-size="38" fill="#6B7280">بتوقيت مكة</text>
  <text id="short_url" x="540" y="1880" text-anchor="middle" direction="ltr"
        font-family="IBM Plex Sans Arabic" font-size="35" fill="#6B7280">app.maqraa.org/s/abcd1234</text>
</svg>
