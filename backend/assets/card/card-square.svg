<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <rect width="1080" height="1080" fill="#FDF6E3"/>

  <!-- Header: logo + tagline. Tighter gap to name. -->
  <g id="logo-slot"/>
  <text id="tagline" x="994" y="148" direction="rtl" text-anchor="end"
        font-family="IBM Plex Sans Arabic" font-size="17" fill="#6B7280">منصة تعليم القرآن</text>

  <!-- Name 9% ≈ 97px at y≈250 -->
  <text id="halaqah_name" x="540" y="250" direction="rtl" text-anchor="middle"
        font-family="Amiri" font-size="97" font-weight="700" fill="#1A1A1A">حلقة النور</text>

  <text id="teacher" x="540" y="288" direction="rtl" text-anchor="middle"
        font-family="IBM Plex Sans Arabic" font-weight="500" font-size="30" fill="#6B7280">مع المعلّم أحمد</text>

  <rect x="546" y="316" width="120" height="44" rx="22" fill="#E8F5E9"/>
  <text id="type" x="606" y="345" direction="rtl" text-anchor="middle"
        font-family="IBM Plex Sans Arabic" font-weight="600" font-size="26" fill="#1B5E20">حفظ</text>
  <rect x="414" y="316" width="120" height="44" rx="22" fill="#E8F5E9"/>
  <text id="riwaya" x="474" y="345" direction="rtl" text-anchor="middle"
        font-family="IBM Plex Sans Arabic" font-weight="600" font-size="26" fill="#1B5E20">حفص</text>

  <!-- QR 45% = 486, cy≈608 → y = 365 (clears badges) -->
  <g id="qr" data-size="486" data-x="297" data-y="365" transform="translate(297 365)"/>
  <text id="scan_hint" x="540" y="875" direction="rtl" text-anchor="middle"
        font-family="IBM Plex Sans Arabic" font-size="22" fill="#6B7280">امسح للانضمام</text>

  <rect x="516" y="900" width="48" height="2" fill="#D4A843"/>
  <text id="first_session" x="540" y="940" direction="rtl" text-anchor="middle"
        font-family="IBM Plex Sans Arabic" font-weight="600" font-size="35" fill="#1B5E20">الثلاثاء ٢٥ أغسطس · ٨:٠٠ م</text>
  <text id="tz_and_rhythm" x="540" y="974" direction="rtl" text-anchor="middle"
        font-family="IBM Plex Sans Arabic" font-size="22" fill="#6B7280">بتوقيت مكة</text>
  <text id="short_url" x="540" y="1040" text-anchor="middle" direction="ltr"
        font-family="IBM Plex Sans Arabic" font-size="19" fill="#6B7280">app.maqraa.org/s/abcd1234</text>
</svg>
